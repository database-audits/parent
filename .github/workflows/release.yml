name: Release to Maven Central

on:
  push:
    tags: ['v*'] # created by maven-release-plugin (tagNameFormat v@{project.version})

permissions:
  contents: read

concurrency:
  group: release-deploy
  cancel-in-progress: false

env:
  MAVEN_COMMAND: ./mvnw
  MAVEN_CLI_COMMON: "-e -B -N"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the guard below can test whether the tagged commit is on main.
          fetch-depth: 0
          persist-credentials: false

      # A tag can be pushed from any branch, but only commits on main are released.
      # Without this guard, tagging any commit on any branch publishes to Maven
      # Central. Runs before jdk-setup so no GPG key or Central credentials are in
      # scope if the check fails.
      - name: Verify tag is on main
        env:
          SHA: ${{ github.sha }}
        run: |
          # fetch-depth: 0 above populates origin/main. Fail loudly if it is ever
          # missing (e.g. fetch-depth gets changed) rather than letting the ancestry
          # test misfire. A plain `git fetch` is deliberately avoided so the guard
          # needs no credentials (persist-credentials: false above).
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::origin/main is not present in the checkout (needs fetch-depth: 0)."
            exit 1
          fi
          if git merge-base --is-ancestor "$SHA" origin/main; then
            echo "Tagged commit $SHA is on main."
          else
            echo "::error::Tagged commit $SHA is not on main. Refusing to release."
            exit 1
          fi

      - uses: ./.github/actions/jdk-setup
        with:
          server-id: central-publish
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Guard against a mistyped tag releasing the wrong version: the POM is the
      # source of truth for what gets deployed, so the tag must encode exactly that
      # version. The resolved version also titles the GitHub Release below.
      - name: Verify tag matches project version
        id: resolve
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(${{ env.MAVEN_COMMAND }} help:evaluate -Dexpression=project.version -q -DforceStdout)"
          expected="v${version}"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag '$TAG' does not match project version (expected '$expected'). Refusing to release."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Deploy release to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ${{ env.MAVEN_COMMAND }} ${{ env.MAVEN_CLI_COMMON }} deploy -Prelease -DskipTests

  # Publish a GitHub Release for the tag once the Central deploy succeeds. Notes are
  # auto-generated by the GitHub Release Notes API from merged PRs/commits since the
  # previous tag. Isolated from the deploy job so contents:write is not granted while
  # GPG keys and Central credentials are in scope.
  github-release:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # required to create the GitHub Release
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }} # via env to avoid script injection
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag
